name: Publish CI Environment Images

# Trigger this workflow only when Dockerfiles are modified
on:
  push:
    branches: [ "main" ]
    paths:
      - 'docker/**'
  workflow_dispatch: # Allows manual trigger from the GitHub UI

# CRITICAL: Grant permission to upload packages to GHCR
permissions:
  contents: read
  packages: write

jobs:
  build-and-push-circt:
    name: Build CIRCT Toolchain Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Convert the repository owner name to strictly lowercase to satisfy Docker naming rules
      - name: Convert owner to lower case
        run: echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CIRCT Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/circt.Dockerfile
          push: true
          # Use the environment variable we just created
          tags: ghcr.io/${{ env.REPO_OWNER }}/circt-toolchain:latest

  build-and-push-gcc17:
    name: Build GCC 17 Daily Environment
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Convert the repository owner name to strictly lowercase to satisfy Docker naming rules
      - name: Convert owner to lower case
        run: echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GCC 17 Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/gcc17.Dockerfile
          push: true
          # Use the environment variable we just created
          tags: ghcr.io/${{ env.REPO_OWNER }}/gcc17-daily-env:latest