name: TinyDIP Hardware-Software Co-Design CI

# ==============================================================================
# Separation of Concerns (vs. snap.yml)
# 
# - snap.yml: Handles macro-level product delivery, cross-platform compatibility
#   (Linux/macOS/ARM64), performance profiling, and Snap packaging.
# 
# - hw-sw-codesign.yml (This file): Serves as the micro-level R&D lab strictly
#   focused on hardware kernels. It runs parallel jobs to verify the core C++ 
#   logic via the latest GCC 17 and synthesizes the SystemVerilog RTL via CIRCT.
# ==============================================================================

on:
  # Trigger on standard code pushes, but strictly ignore changes in the docker folder
  # to prevent race conditions when rebuilding the infrastructure images.
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'docker/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'docker/**'
      
  # Trigger automatically after the CI Environment Images workflow completes.
  workflow_run:
    workflows: [ "Publish CI Environment Images" ]
    types:
      - completed

jobs:
  # ------------------------------------------------------------------------------
  # Job 1: Software Twin Verification (GCC 17 Daily Build)
  # ------------------------------------------------------------------------------
  # Purpose:
  # 1. Macro Abstraction Check: Ensures that hardware-specific annotations 
  #    (e.g., TINYDIP_HW_FLATTEN) are safely ignored by strict C++ compilers 
  #    without triggering syntax errors under -Werror.
  # 2. Algorithm Equivalence: Proves that the exact same C++20/23 source code 
  #    fed to the hardware synthesizer produces mathematically correct results 
  #    when executed on a standard CPU.
  software-twin-verification:
    name: CPU Software Twin Test (GCC 17)
    runs-on: ubuntu-latest
    # Crucial safety check: Run ONLY if it's a normal push/PR, OR if the preceding Docker build succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    container:
      # Explicitly hardcoded to lowercase 'jimmy-hu' to comply with Docker registry rules
      # as GitHub expressions lack a built-in lowercase function during Job Setup.
      image: ghcr.io/jimmy-hu/gcc17-daily-env:latest 
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure ccache persistence
        uses: actions/cache@v4
        with:
          path: /github/home/.cache/ccache
          key: ccache-gcc17-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-gcc17-${{ runner.os }}-

      - name: "Configure CMake (Preset: hw-codesign)"
        run: cmake --preset hw-codesign -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror" -DENABLE_CUDA=OFF -DPOLYGEIST_EXECUTABLE=/bin/true

      - name: "Build Hardware Kernel Tests (Preset: hw-build-twin)"
        run: cmake --build --preset hw-build-twin

      - name: "Execute Software Twin Logic"
        run: ./build_hw-codesign/tinydip_hw_kernel_tests

  # ------------------------------------------------------------------------------
  # Job 2: Hardware Synthesis Pipeline (Polygeist / CIRCT)
  # ------------------------------------------------------------------------------
  # Purpose:
  # Translates the verified C++ hardware kernels into MLIR and ultimately lowers 
  # them into synthesizable SystemVerilog (FIRRTL) using the LLVM/CIRCT toolchain.
  hardware-synthesis:
    name: "RTL Synthesis (CIRCT)"
    runs-on: ubuntu-latest
    # Crucial safety check applies here as well
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    container:
      # Explicitly hardcoded to lowercase 'jimmy-hu' to comply with Docker registry rules
      image: ghcr.io/jimmy-hu/circt-toolchain:latest
      
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Configure CMake (Preset: hw-codesign)"
        run: cmake --preset hw-codesign -DENABLE_CUDA=OFF -DPOLYGEIST_EXECUTABLE=/opt/polygeist/bin/cgeist

      - name: "Run CIRCT Synthesis Pipeline (Preset: hw-build-rtl)"
        run: cmake --build --preset hw-build-rtl

      - name: "Upload Hardware RTL Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: tinydip-systemverilog-rtl
          path: build_hw-codesign/*.sv
          retention-days: 7